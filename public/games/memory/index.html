<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四音记忆小舞台</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="画布"></canvas>
<div id="开始层" class="覆盖">
  <div class="卡">
    <div class="题">四音记忆<br>小舞台</div>
    <div class="副题">先听一串乐器声音，再按顺序重复。<br>关卡越高，顺序越长。</div>
    <div class="说明条">先听示范 → 记住顺序 → 点击同样的乐器。
也可以按数字键 1、2、3、4 来演奏。</div>
    <div class="按钮组"><button id="开始按钮" class="按钮">开始记忆</button></div>
  </div>
</div>
<div id="结算层" class="覆盖 隐藏">
  <div class="卡">
    <div id="结算题" class="题">记忆小乐师</div>
    <div id="结算副题" class="副题"></div>
    <div id="结算详情" class="说明条"></div>
    <div class="按钮组"><button id="重来按钮" class="按钮">再玩一次</button></div>
  </div>
</div>
<script src="./game.js" defer></script>
</body>
</html>
